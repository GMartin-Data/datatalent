version: 2

models:
  - name: int_offres_enrichies
    description: >
      Table unifiée des offres d'emploi IT/Data. Combine France Travail
      (~2 589 offres, 4 codes ROME) et Adzuna (~2 171 offres "data engineer")
      via UNION ALL. Toutes les harmonisations inter-sources (structure D80,
      libellés D86, valeurs D90, flag is_salaire_aberrant D91) sont opérées
      au staging — l'intermediate est minimaliste : UNION ALL + résolution
      code_departement Adzuna + enrichissement géo (stg_geo__communes) avec
      fallback code_departement (stg_geo__departements). Pas de jointure
      stg_geo__regions (nom_region déjà dénormalisé). PLM transparent (D87,
      remap fait au staging FT). Matérialisée en table (D52). Pas de
      déduplication inter-sources (D46).
    columns:
      - name: offre_id
        description: Identifiant unique de l'offre (format FT ou Adzuna).
        data_tests:
          - unique
          - not_null

      - name: titre
        description: Intitulé de l'offre, propagé depuis le staging.
        data_tests:
          - not_null

      - name: description
        description: Description de l'offre. FT = texte complet, Adzuna = snippet tronqué.

      - name: date_creation
        description: Date de publication originale (TIMESTAMP).
        data_tests:
          - not_null

      - name: source
        description: "Discriminant source : 'france_travail' ou 'adzuna' (D46)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["france_travail", "adzuna"]

      - name: categorie_metier
        description: >
          Classification métier issue de la macro partagée
          classify_categorie_metier (D85). 7 valeurs possibles.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - data_engineer
                  - data_analyst
                  - data_architect
                  - bi_decisionnel
                  - ml_engineer
                  - data_scientist
                  - autre_it

      - name: is_metier_data
        description: >
          Filet large permissif (D89) — TRUE si le titre contient 'data' OU
          un terme métier (ml/scientist/engineer/analyst). Plus permissif que
          categorie_metier != 'autre_it'.
        data_tests:
          - not_null

      - name: is_data_engineer
        description: >
          Flag de confort sur la cible métier projet (D81) — TRUE si
          categorie_metier = 'data_engineer'.
        data_tests:
          - not_null

      - name: type_contrat
        description: >
          Code contrat. FT : codes natifs au format `^[A-Z]{3}$` contrôlé 
          par test matches_regex (D92 supersedes D88). 9 codes historiquement 
          observés au 2026-05-18 : CDI, CDD, MIS, LIB, CCE, SAI, DDI, FRA, 
          DDT — liste indicative non exhaustive par construction du test. 
          Adzuna : mappé permanent→CDI, contract→CDD au staging (D90). NULL 
          pour Adzuna quand valeur source absente ou hors mapping (70.6% Adzuna).

        data_tests:
          - matches_regex:
              arguments:
                pattern: "^[A-Z]{3}$"

      - name: experience_exige
        description: Niveau d'expérience exigé (D/E/S). FT only.

      - name: experience_duree_annees
        description: >
          Durée d'expérience exigée en années (FLOAT64). FT only — calcul
          regex + division /12.0 fait au staging. NULL côté Adzuna.

      - name: temps_travail
        description: >
          Temps plein / Temps partiel. Adzuna mappé au staging (D90,
          full_time→Temps plein, part_time→Temps partiel).
        data_tests:
          - accepted_values:
              arguments:
                values: ["Temps plein", "Temps partiel"]
              config:
                where: "temps_travail IS NOT NULL"

      - name: nombre_postes
        description: Nombre de postes ouverts. FT only.

      - name: is_alternance
        description: Flag alternance. FT only.

      - name: qualification_code
        description: Code qualification FT. FT only.

      - name: qualification_libelle
        description: Libellé qualification FT. FT only.

      - name: salaire_annuel_min
        description: >
          Salaire minimum en euros/an. FT : normalisé depuis libellé (périodicité
          + nb mois) au staging. Adzuna : inféré annuel au staging (D77).
          ⚠ Non strictement comparables entre sources malgré l'harmonisation
          d'unité — filtrer par source pour analyses salariales fines.

      - name: salaire_annuel_max
        description: Salaire maximum en euros/an. Mêmes caveats que salaire_annuel_min.

      - name: is_salaire_aberrant
        description: >
          TRUE si salaire aberrant. Seuils harmonisés D86 A.5 / D91 :
          salaire_annuel_min < 15000 OU = 0 OU salaire_annuel_max > 250000.
          Calculé au staging des deux côtés.

      - name: is_salaire_requalifie
        description: >
          FT only (D86 A.4) — TRUE si requalification d'unité au staging
          (mensuel > 10k€ ou horaire > 100€/h traités comme annuel). NULL
          côté Adzuna (pas de requalification d'unité).

      - name: is_salaire_periodicite_inferree
        description: >
          Adzuna only (D86 A.4) — TRUE si la périodicité du salaire a été
          inférée statistiquement au staging (D77). NULL côté FT
          (périodicité explicite dans le libellé source).

      - name: source_salaire
        description: "'declare' quand salaire présent, NULL sinon. Calculé au staging des deux côtés (alignement D90)."
        data_tests:
          - accepted_values:
              arguments:
                values: ["declare"]
              config:
                where: "source_salaire IS NOT NULL"

      - name: code_commune
        description: >
          Code INSEE commune (post-PLM staging D87). FT : 92.7% non-null.
          Adzuna : toujours NULL (pas de code INSEE dans l'API Adzuna).
          Clé de jointure principale vers stg_geo__communes.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_geo__communes')
                field: code
              config:
                where: "code_commune IS NOT NULL"

      - name: code_departement
        description: >
          Code département. FT : extrait du code_commune au staging (100%).
          Adzuna : résolu via jointure departement_nom = stg_geo__departements.nom
          (égalité stricte, ~85.6%). Clé de jointure fallback et lien vers
          int_tensions_bassin_emploi.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_geo__departements')
                field: code
              config:
                where: "code_departement IS NOT NULL"

      - name: libelle_lieu
        description: Libellé textuel du lieu (FT.localisation_libelle ou Adzuna.localisation_libelle, renommé symétriquement).

      - name: latitude
        description: Latitude (FLOAT64). FT 89.3%, Adzuna 86.2%.

      - name: longitude
        description: Longitude (FLOAT64). FT 89.3%, Adzuna 86.2%.

      - name: nom_commune
        description: >
          Nom de la commune via jointure stg_geo__communes. NULL si
          code_commune absent (toutes les offres Adzuna et 7.3% des FT).

      - name: nom_departement
        description: >
          Nom du département. COALESCE(communes.nom_departement, departements.nom).
          Chemin principal via code_commune, fallback via code_departement.

      - name: nom_region
        description: >
          Nom de la région. COALESCE(communes.nom_region, departements.nom_region).
          Pas de jointure stg_geo__regions — nom_region déjà dénormalisé dans
          les deux référentiels.

      - name: population
        description: >
          Population municipale de la commune. NULL si code_commune absent.
          Pas de fallback département (granularité incompatible).

      - name: entreprise_nom
        description: Nom de l'entreprise. FT 36.2%, Adzuna 98.9%.

      - name: code_naf
        description: Code NAF employeur. FT only (47.8%). Biaisé intérim 38.3% (Axe 2).

      - name: secteur_activite_libelle
        description: Libellé secteur activité. FT only (47.8%).

      - name: tranche_effectif
        description: Tranche d'effectif employeur. FT only (15.7%).

      - name: is_intermediaire
        description: >
          TRUE si code_naf IN ('78.10Z', '78.20Z'). FT only. NULL si code_naf
          absent ou source Adzuna. Indispensable pour les analyses salariales.

      - name: rome_code
        description: Code ROME. FT only (100%). NULL pour Adzuna.

      - name: rome_libelle
        description: Libellé ROME. FT only (100%). NULL pour Adzuna.

  - name: int_densite_sectorielle_commune
    description: >
      Agrégation des effectifs salariés et établissements du secteur IT (APE
      62xx) par commune et par année, à partir des données URSSAF. Les codes
      communes de Paris, Lyon et Marseille sont normalisés (arrondissements →
      code central INSEE) pour garantir la jointure avec les offres France
      Travail dans les marts aval. Grain : une ligne par code_commune × annee.

    columns:
      - name: code_commune
        description: >
          Code INSEE commune, post-normalisation PLM. Paris → 75056, Lyon →
          69123, Marseille → 13055.
        tests:
          - not_null

      - name: annee
        description: Année de référence des effectifs URSSAF.
        tests:
          - not_null

      - name: nb_etablissements_it
        description: >
          Nombre d'établissements du secteur IT (APE 62xx) dans la commune pour
          l'année donnée.
        tests:
          - not_null

      - name: effectifs_salaries_it
        description: >
          Nombre de salariés du secteur IT (APE 62xx) dans la commune pour
          l'année donnée.
        tests:
          - not_null

  - name: int_tensions_bassin_emploi
    description: >
      Volumes de projets de recrutement IT et taux de difficulté (deux méthodes)
      agrégés par département × année. Expose également les compteurs de
      couverture nécessaires au mart aval pour calculer les flags de fiabilité
      (D75). Source unique : stg_bmo__projets_recrutement (enquête BMO 2025, 6
      codes FAP IT). Le WHERE sur M1X%/M2X% est une redondance défensive.
      Méthode A = AVG des taux par bassin (vue territoriale). Méthode B-filtrée
      = SUM/SUM aligné sur les lignes complètes (vue volumique).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_departement
              - annee
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nb_bassins_volume_observable <= nb_bassins_total"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "nb_bassins_taux_calculable <= nb_bassins_volume_observable"
    columns:
      - name: code_departement
        description: Code département INSEE — clé de jointure vers
          mart_contexte_territorial.
        data_tests:
          - not_null
      - name: annee
        description: Année de l'enquête BMO (2025).
        data_tests:
          - not_null
      - name: projets_recrutement_it
        description: >
          Somme des projets de recrutement IT déclarés dans le département.
          Plancher : les bassins masqués par secret statistique sont exclus.
      - name: projets_difficiles_it
        description: >
          Somme des projets de recrutement IT jugés difficiles. Couverture
          structurellement plus faible que projets_recrutement_it (42,4% vs
          62,7% au global, masquage hiérarchique D75).
      - name: part_difficile_pct_par_bassin
        description: >
          Taux de difficulté méthode A (D75) — moyenne non pondérée des taux par
          bassin observable. Vue territoriale. Arrondi à 1 décimale.
      - name: part_difficile_pct_par_projet
        description: >
          Taux de difficulté méthode B-filtrée (D75) — ratio volumique (projets
          difficiles / projets totaux), calculé sur les bassins où les deux
          mesures sont renseignées. Vue volumique, sémantique intuitive pour le
          dashboard. Arrondi à 1 décimale.
      - name: nb_bassins_total
        description: Nombre total de lignes bassin × métier dans le département × année.
        data_tests:
          - not_null
      - name: nb_bassins_volume_observable
        description: >
          Nombre de bassins dont projets_recrutement est connu (non masqué).
          Alimente pct_couverture_volume et is_fiable_volume au mart.
        data_tests:
          - not_null
      - name: nb_bassins_taux_calculable
        description: >
          Nombre de bassins dont projets_difficiles est connu (donc taux par
          projet calculable). Alimente pct_couverture_taux et is_fiable_taux au
          mart.
        data_tests:
          - not_null
