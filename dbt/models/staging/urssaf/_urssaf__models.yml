version: 2

models:
  # --- Modèle 1 : Les effectifs ---
  - name: stg_urssaf__effectifs_commune_ape
    description: >
      Effectifs salariés et établissements employeurs IT par commune × code APE
      × année (2006–2024). Source : open.urssaf.fr, dataset Opendatasoft. 4
      codes APE IT filtrés à l'ingestion (D37). Format long après unpivot
      Python. Colonnes renommées à l'ingestion (D39). ⚠ Paris = arrondissements
      75101–75120, pas commune 75056.
    config:
      meta:
        owner: Louis
        update_frequency: hebdomadaire
      tags: ['staging', 'urssaf']
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - code_commune
              - code_ape
              - annee
    columns:
      - name: code_commune
        description: >
          Code INSEE commune. ⚠ Pour Paris, codes arrondissements (75101–75120),
          pas code commune centrale (75056). Gestion en intermediate.
        data_tests:
          - not_null

      - name: intitule_commune
        description: >
          Champ composite URSSAF "code nom" (ex: "94065 Rungis"). Redondant avec
          code_commune + API Géo. Conservé par fidélité source, non utilisé en
          aval.

      - name: code_departement
        description: Code département
        data_tests:
          - not_null

      - name: code_ape
        description: >
          Code APE sans point (6201Z, 6202A, 6203Z, 6209Z). Filtré à l'ingestion
          (D37).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ "6201Z", "6202A", "6203Z", "6209Z" ]

      - name: annee
        description: Année de référence (2006–2024)
        data_tests:
          - not_null

      - name: nb_etablissements
        description: >
          Nombre d'établissements employeurs. COALESCE(raw, 0) appliqué en
          staging — un 0 peut signifier "pas de donnée déclarée" si l'autre
          colonne avait une valeur.
        data_tests:
          - not_null

      - name: effectifs_salaries
        description: >
          Effectifs salariés en fin d'année. COALESCE(raw, 0) appliqué en
          staging — même caveat que nb_etablissements.
        data_tests:
          - not_null

  # --- Modèle 2 : La masse salariale ---
  - name: stg_urssaf__masse_salariale_na88
    description: >
      Table de référence sectorielle URSSAF — masse salariale brute et effectifs
      du secteur IT (NA88 = 62) par année (1998–2024). Source : open.urssaf.fr,
      dataset Opendatasoft. Colonnes renommées à l'ingestion (D39).
    config:
      meta:
        owner: Abdel
        update_frequency: hebdomadaire
      tags: ['staging', 'urssaf']
    columns:
      - name: annee
        description: Année de référence (1998–2024)
        data_tests:
          - unique
          - not_null

      - name: code_na88
        description: Code secteur NA88 (= 62 systématiquement, filtré à l'ingestion D37)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ 62 ]
                quote: false # code_na88 est INT64 — sans ce flag, dbt génère IN ('62') et BigQuery refuse la coercition

      - name: libelle_na88
        description: "Libellé secteur : Programmation, conseil et autres activités
          informatiques"
        data_tests:
          - not_null

      - name: nb_etablissements
        description: Nombre moyen annuel d'établissements employeurs
        data_tests:
          - not_null

      - name: effectifs_salaries_moyens
        description: Effectif salarié moyen annuel
        data_tests:
          - not_null

      - name: masse_salariale_brute
        description: Masse salariale annuelle brute en euros (assiette déplafonnée Sécu)
        data_tests:
          - not_null
