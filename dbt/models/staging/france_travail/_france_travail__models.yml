version: 2

models:
  - name: stg_france_travail__offres
    description: "Table staging des offres France Travail (JSON → tabulaire)"
    columns:
      - name: offre_id
        tests:
          - not_null
          - unique

      - name: titre
        tests:
          - not_null

      - name: rome_code
        tests:
          - not_null

      - name: date_creation
        tests:
          - not_null

      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['france_travail']
              config:
                severity: warn

      - name: type_contrat
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CDI', 'CDD', 'MIS', 'LIB', 'CCE', 'SAI', 'DDI', 'FRA']
              config:
                severity: warn

      - name: experience_exige
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['D', 'E']
              config:
                severity: warn

      - name: categorie_metier
        tests:
          - accepted_values:
              arguments:
                values: [
                  'data_engineer',
                  'data_analyst',
                  'data_architect',
                  'bi_decisionnel',
                  'ml_engineer',
                  'data_scientist',
                  'autre_it'
                ]
              config:
                severity: warn

      - name: salaire_periodicite
        tests:
          - accepted_values:
              arguments:
                values: ['annuel', 'mensuel', 'horaire']
                quote: true
              config:
                severity: warn
                where: "salaire_periodicite IS NOT NULL"

      - name: code_departement
        tests:
          - not_null

      - name: code_commune
        tests:
          - relationships:
              arguments:
                to: ref('stg_geo__communes')
                field: code
              config:
                severity: warn

      - name: is_data_engineer
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= (categorie_metier = 'data_engineer')"