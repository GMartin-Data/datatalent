version: 2

models:
  - name: stg_adzuna__offres
    description: >
      Offres d'emploi issues d'Adzuna.
      Modèle de staging mono-source dédupliqué par offre_id via _ingestion_date.
      Aucune ligne n'est filtrée à ce stade : les colonnes de classification et de flag
      permettent le tri en intermediate. Colonnes renommées à l'ingestion (D39).
      Alimente int_offres_enrichies via UNION ALL avec stg_france_travail__offres.
    columns:
      - name: offre_id
        description: Identifiant unique Adzuna, casté en STRING pour harmonisation aval.
        data_tests:
          - unique
          - not_null

      - name: titre
        description: Intitulé de l'offre.
        data_tests:
          - not_null

      - name: description
        description: Snippet tronqué de la description, pas le texte intégral.

      - name: date_creation
        description: Date de création de l'offre côté source.
        data_tests:
          - not_null

      - name: source
        description: Constante de traçabilité de la source.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["adzuna"]

      - name: categorie_metier
        description: >
          Catégorie métier dérivée du titre via la macro projet classify_categorie_metier.
          Cette macro centralise la classification métier afin d'éviter les divergences
          entre les stagings Adzuna et France Travail.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "data_engineer"
                  - "data_analyst"
                  - "data_architect"
                  - "bi_decisionnel"
                  - "ml_engineer"
                  - "data_scientist"
                  - "autre_it"

      - name: is_metier_data
        description: >
          Filet large (D89) — TRUE si le titre contient "data" ou un mot-clé métier
          (ml, scientist, engineer, analyst). Volontairement plus permissif que
          categorie_metier pour capter les offres qui touchent à la data au sens large
          (Software Engineer, Risk Analyst, etc.). Symétrie avec FT.
        data_tests:
          - not_null

      - name: is_data_engineer
        description: "Flag métier cible projet : categorie_metier = 'data_engineer' (D81). Symétrie avec FT."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= (categorie_metier = 'data_engineer')"

      - name: entreprise_nom
        description: Nom commercial de l'entreprise (pas raison sociale).

      - name: localisation_libelle
        description: Libellé textuel de localisation.
        data_tests:
          - not_null

      - name: region
        description: Région extraite depuis localisation_area[1].

      - name: departement_nom
        description: Département textuel extrait depuis localisation_area[2].

      - name: latitude
        description: Latitude de l'offre.

      - name: longitude
        description: Longitude de l'offre.

      - name: salaire_min
        description: Salaire minimum déclaré par la source. L'unité ou la périodicité peut varier selon l'offre.

      - name: salaire_max
        description: Salaire maximum déclaré par la source. L'unité ou la périodicité peut varier selon l'offre.

      - name: source_salaire
        description: "'declare' si un salaire est présent, sinon NULL. Ne préjuge pas de l'unité du salaire."
        data_tests:
          - accepted_values:
              arguments:
                values: ["declare"]
              config:
                where: "source_salaire IS NOT NULL"

      - name: salaire_est_estime
        description: >
          Indicateur source Adzuna. Code mort défensif — 100% à '0' sur FR à date.
          Typé en INT64 via safe_cast (D82).

      - name: salaire_periodicite
        description: >
          Périodicité de salaire inférée par heuristique sur l'ordre de grandeur du montant Adzuna (D77/D79).
          Valeurs : 'annuel' si min ∈ [15k, 250k], 'mensuel' si min ∈ [1k, 14999], NULL sinon.
          Naming aligné Adzuna ↔ FT (D86 A.3) — suffixe _inferree retiré, porté par le flag
          is_salaire_periodicite_inferree (Adzuna-spécifique).
        data_tests:
          - accepted_values:
              arguments:
                values: ["annuel", "mensuel"]
              config:
                where: "salaire_periodicite IS NOT NULL"

      - name: is_salaire_periodicite_inferree
        description: TRUE si une périodicité salaire a pu être inférée de façon prudente.

      - name: salaire_annuel_min
        description: >
          Salaire minimum annualisé à partir de la périodicité inférée.
          Égal au salaire brut si la périodicité est inférée comme annuelle,
          ou salaire mensuel * 12 si elle est inférée comme mensuelle.
          Si seul salaire_max est disponible, salaire_annuel_min reprend la valeur disponible
          pour conserver une symétrie min/max.

      - name: salaire_annuel_max
        description: >
          Salaire maximum annualisé à partir de la périodicité inférée.
          Égal au salaire brut si la périodicité est inférée comme annuelle,
          ou salaire mensuel * 12 si elle est inférée comme mensuelle.

      - name: is_salaire_aberrant
        description: >
          Flag d'aberration salariale aligné sur le seuil FT D86 A.5 (D91).
          TRUE si salaire_annuel_min < 15000 OU = 0 OU salaire_annuel_max > 250000.
          NULL si les deux salaires annuels sont NULL (propagation booléenne
          ternaire SQL). Calcul opéré au staging pour symétrie inter-sources
          avec stg_france_travail__offres et propagation pure en intermediate.

      - name: type_contrat
        description: >
          Type de contrat harmonisé sur le vocabulaire FT (D90).
          Mapping en staging via CTE harmonized :
          permanent → CDI, contract → CDD, autre → NULL.
          Asymétrie de couverture assumée vs FT (D88, 8 codes) :
          Adzuna n'émet que 2 réalités contractuelles, le test 
          n'enum que les codes effectivement produits.
        data_tests:
          - accepted_values:
              arguments:
                values: ["CDI", "CDD"]
              config:
                where: "type_contrat IS NOT NULL"

      - name: temps_travail
        description: >
          Temps de travail harmonisé sur le vocabulaire FT (D90).
          Mapping en staging via CTE harmonized :
          full_time → Temps plein, part_time → Temps partiel, autre → NULL.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Temps plein", "Temps partiel"]
              config:
                where: "temps_travail IS NOT NULL"

      - name: categorie_tag
        description: Secteur de l'entreprise (pas métier). Proxy sectoriel grossier en l'absence de code NAF.

      - name: categorie_libelle
        description: Libellé de catégorie Adzuna.

      - name: redirect_url
        description: >
          URL de redirection vers la fiche Adzuna. Traçabilité — non exploitable pour
          déduplication (toutes pointent vers adzuna.fr).
