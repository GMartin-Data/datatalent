version: 2

models:
  - name: fct_offres_enrichies
    description: >
      Mart principal des offres d'emploi IT/Data au grain offre.
      Ce modèle est alimenté par int_offres_enrichies et ajoute des
      transformations métier et analytiques pour Looker Studio :
      salaires multi-vues, regroupement sectoriel codeNAF, flags qualité,
      dimensions temporelles et métriques fenêtrées.

    columns:
      - name: offre_id
        description: Identifiant technique de l'offre dans sa source d'origine.
        data_tests:
          - not_null

      - name: titre
        description: Titre de l'offre.
        data_tests:
          - not_null

      - name: date_creation
        description: Date de création ou de publication de l'offre.
        data_tests:
          - not_null

      - name: source
        description: Source de l'offre.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - france_travail
                  - adzuna

      - name: categorie_metier
        description: Catégorie métier harmonisée issue du staging.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - data_engineer
                  - data_analyst
                  - data_architect
                  - bi_decisionnel
                  - ml_engineer
                  - data_scientist
                  - autre_it

      - name: is_metier_data
        description: Booléen indiquant si l'offre appartient au périmètre data.
        data_tests:
          - not_null

      - name: salaire_milieu
        description: >
          Salaire annuel moyen calculé à partir de la fourchette min/max.
          Les salaires aberrants sont neutralisés.

      - name: salaire_milieu_pour_agregat
        description: >
          Salaire annuel moyen utilisable pour les agrégats.
          Les salaires estimés sont exclus si la source salaire les identifie.

      - name: salaire_milieu_hors_interim
        description: >
          Salaire annuel moyen utilisable pour les agrégats hors offres
          intermédiaires, ESN ou intérim.

      - name: tranche_salaire
        description: Tranche de salaire annuelle utilisée pour les filtres et histogrammes.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - non_renseigne
                  - a_moins_35k
                  - b_35_45k
                  - c_45_60k
                  - d_60_80k
                  - e_80_100k
                  - f_plus_100k

      - name: est_salaire_fiable
        description: >
          Flag indiquant qu'un salaire est exploitable pour une analyse fiable :
          salaire non aberrant, offre non intermédiaire et source déclarative
          ou absente.
        data_tests:
          - not_null

      - name: code_naf_normalise
        description: >
          Code NAF nettoyé sans ponctuation.
          Exemple : 62.02A devient 6202A.

      - name: secteur_grande_categorie
        description: >
          Regroupement du code NAF en grandes catégories sectorielles
          exploitables dans Looker Studio.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Tech_IT_pur
                  - Edition_logiciel
                  - Conseil
                  - ESN_Interim
                  - Banque_Finance_Assurance
                  - Public_Sante_Education
                  - Industrie_Commerce
                  - Autres
                  - Non_renseigne

      - name: est_recruteur_intermediaire
        description: >
          Flag indiquant si l'offre provient d'un intermédiaire, d'une ESN
          ou d'un acteur identifié comme intérim/soutien par le code NAF.
        data_tests:
          - not_null

      - name: qualite_donnee_score
        description: >
          Score de complétude analytique de l'offre, de 0 à 5.
          Les critères sont : salaire disponible, commune disponible,
          code NAF disponible, entreprise disponible et description longue.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5]
                quote: false

      - name: est_analysable_geo_commune
        description: Flag indiquant si l'offre est analysable au niveau commune.
        data_tests:
          - not_null

      - name: est_analysable_geo_dept
        description: Flag indiquant si l'offre est analysable au niveau département.
        data_tests:
          - not_null

      - name: est_analysable_salaire
        description: Flag indiquant si l'offre possède un salaire exploitable.
        data_tests:
          - not_null

      - name: est_analysable_secteur
        description: Flag indiquant si l'offre possède un code NAF exploitable.
        data_tests:
          - not_null

      - name: date_creation_jour
        description: Date de création au format jour.

      - name: mois_creation
        description: Mois de création de l'offre.

      - name: trimestre_creation
        description: Trimestre de création de l'offre.

      - name: annee_creation
        description: Année de création de l'offre.

      - name: annee_trimestre_creation
        description: Libellé année-trimestre, par exemple 2026-Q1.

      - name: delai_jours_depuis_creation
        description: Nombre de jours entre la date de création et la date du run.

      - name: nb_offres_commune
        description: >
          Nombre total d'offres dans la commune.
          Cette métrique est principalement disponible pour France Travail,
          car Adzuna ne fournit pas de code commune.

      - name: nb_offres_categorie_dept
        description: Nombre d'offres par couple catégorie métier et département.

      - name: nb_offres_meme_entreprise_60j
        description: >
          Nombre d'offres publiées par la même entreprise dans une fenêtre
          glissante de 60 jours.

      - name: densite_offres_par_100k_hab
        description: >
          Densité d'offres pour 100 000 habitants, calculée à partir du volume
          d'offres commune et de la population communale.

      - name: rang_volume_commune
        description: Rang de la commune selon son volume total d'offres.

      - name: dbt_loaded_at
        description: Timestamp technique de chargement du modèle dbt.
        data_tests:
          - not_null

      - name: dbt_invocation_id
        description: Identifiant technique du run dbt.
        data_tests:
          - not_null